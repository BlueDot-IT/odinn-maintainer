name: Odinn Maintainer Review
description: Run a bounded OAuth-backed Odinn Maintainer review for a GitHub pull request or issue.
inputs:
  github-token:
    description: GitHub token used to read the target and publish the sticky review comment and named Check.
    required: true
  oauth-json:
    description: Odinn OAuth token record JSON. It is consumed in memory and never commented.
    required: true
  model:
    description: ChatGPT Codex model to use.
    default: gpt-5.5
  number:
    description: Optional issue or pull request number for manual dispatch.
    default: ""
  oauth-client-id:
    description: OAuth client id.
    default: app_EMoamEEZ73f0CkXaXp7hrann
  originator:
    description: Codex transport originator.
    default: odinn-maintainer
  client-version:
    description: Codex transport client version.
    default: "4.0.3"
  automation-login:
    description: GitHub login trusted to own the sticky review comment.
    default: github-actions[bot]
outputs:
  decision:
    description: Conservative review decision.
    value: ${{ steps.review.outputs.decision }}
  confidence:
    description: Review confidence.
    value: ${{ steps.review.outputs.confidence }}
  number:
    description: Reviewed issue or pull request number.
    value: ${{ steps.review.outputs.number }}
  cached:
    description: Whether a prior keep-open review was reused without model spend.
    value: ${{ steps.review.outputs.cached }}
  skipped:
    description: Whether policy skipped the target before model spend.
    value: ${{ steps.review.outputs.skipped }}
  stale:
    description: Whether the item changed during review and blocked publication.
    value: ${{ steps.review.outputs.stale }}
runs:
  using: composite
  steps:
    - id: review
      name: Run bounded OAuth review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ODINN_OPENAI_OAUTH_JSON: ${{ inputs.oauth-json }}
        ODINN_MAINTAINER_MODEL: ${{ inputs.model }}
        ODINN_MAINTAINER_NUMBER: ${{ inputs.number }}
        ODINN_OPENAI_OAUTH_CLIENT_ID: ${{ inputs.oauth-client-id }}
        ODINN_OPENAI_ORIGINATOR: ${{ inputs.originator }}
        ODINN_OPENAI_CLIENT_VERSION: ${{ inputs.client-version }}
        ODINN_MAINTAINER_BOT_LOGIN: ${{ inputs.automation-login }}
      run: node "${{ github.action_path }}/../../maintainer/index.mjs"
