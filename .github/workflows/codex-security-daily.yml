name: Codex Security daily scan

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      target_repository:
        description: BlueDot repository to scan.
        required: false
        type: string
        default: BlueDot-IT/Odinn-Forge
      target_ref:
        description: Trusted branch to scan.
        required: false
        type: string
        default: main
    secrets:
      ODINN_OPENAI_OAUTH_JSON:
        required: true
      ODINN_SECURITY_ARTIFACT_KEY:
        required: true

permissions: {}

concurrency:
  group: codex-security-daily-${{ inputs.target_repository || 'BlueDot-IT/Odinn-Forge' }}
  cancel-in-progress: true

env:
  CODEX_SECURITY_PACKAGE: "@openai/codex-security@0.1.4"
  TARGET_REPOSITORY: ${{ inputs.target_repository || 'BlueDot-IT/Odinn-Forge' }}
  TARGET_REF: ${{ inputs.target_ref || 'main' }}
  TARGET_DIR: ${{ github.workspace }}/target-repository

jobs:
  codex-security:
    name: Codex Security
    if: github.repository_owner == 'BlueDot-IT'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate internal scan target
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          REQUESTED_TARGET: ${{ inputs.target_repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_REPOSITORY" in
            BlueDot-IT/*) ;;
            *)
              echo "Codex Security targets must remain inside BlueDot-IT." >&2
              exit 1
              ;;
          esac
          if test -n "$REQUESTED_TARGET"; then
            test "$TARGET_REPOSITORY" = "$CALLER_REPOSITORY"
          fi
          test "$TARGET_REF" = "main"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Codex Security
        env:
          INSTALL_DIR: ${{ runner.temp }}/codex-security
          EXPECTED_LOCK_SHA256: 597ac0b6454620e6973d103b3937d66f948ceed0ab97c4bc06b979f0bd78488f
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          npm install \
            --prefix "$INSTALL_DIR" \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            "$CODEX_SECURITY_PACKAGE"
          printf '%s  %s\n' "$EXPECTED_LOCK_SHA256" "$INSTALL_DIR/package-lock.json" |
            sha256sum --check --strict
          npm ci \
            --prefix "$INSTALL_DIR" \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify Codex Security
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CODEX_SECURITY_BIN"
          test "$("$CODEX_SECURITY_BIN" --version)" = "0.1.4"

      - name: Verify Codex Linux sandbox
        env:
          CODEX_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CODEX_BIN"

          # Ubuntu 24.04 hosted runners block the unprivileged user namespace
          # that Codex's bubblewrap sandbox requires. This runner is ephemeral.
          if test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          "$CODEX_BIN" sandbox true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          path: target-repository
          persist-credentials: false
          fetch-depth: 0

      - name: Bind scan to an immutable worktree snapshot
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Codex Security CI snapshot marker; intentionally untracked.' \
            > "$TARGET_DIR/.codex-security-ci-snapshot"

      - name: Restore ChatGPT OAuth sign-in
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_AUTH_JSON: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$CODEX_AUTH_JSON"; then
            echo "Set the ODINN_OPENAI_OAUTH_JSON repository or organization secret." >&2
            exit 1
          fi
          install -d -m 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          "$CODEX_SECURITY_BIN" login status

      - name: Scan repository
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
        shell: bash
        run: |
          set -euo pipefail
          "$CODEX_SECURITY_BIN" scan "$TARGET_DIR" \
            --mode standard \
            --model gpt-5.6-terra \
            --output-dir "$SCAN_DIR" \
            --json > "$RUNNER_TEMP/codex-security.json"

      - name: Export SARIF
        id: export-sarif
        if: always()
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
          SARIF_FILE: ${{ runner.temp }}/codex-security.sarif
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$SCAN_DIR/scan-manifest.json"; then
            "$CODEX_SECURITY_BIN" export "$SCAN_DIR" \
              --export-format sarif \
              --source-root "$TARGET_DIR" \
              --output "$SARIF_FILE"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Encrypt scan results
        if: always()
        env:
          RESULTS_ENCRYPTION_KEY: ${{ secrets.ODINN_SECURITY_ARTIFACT_KEY }}
          ENCRYPTED_ARCHIVE: ${{ runner.temp }}/codex-security-results-${{ github.run_id }}.tar.gz.enc
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESULTS_ENCRYPTION_KEY"

          files=()
          for name in codex-security-results codex-security.json codex-security.sarif; do
            if test -e "$RUNNER_TEMP/$name"; then
              files+=("$name")
            fi
          done
          test "${#files[@]}" -gt 0

          tar -czf - -C "$RUNNER_TEMP" "${files[@]}" |
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass env:RESULTS_ENCRYPTION_KEY \
              -out "$ENCRYPTED_ARCHIVE"
          python - "$ENCRYPTED_ARCHIVE" <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path
          import sys

          archive = Path(sys.argv[1])
          key = hashlib.sha256(
              b"odinn-security-artifact-mac-v1\0"
              + os.environ["RESULTS_ENCRYPTION_KEY"].encode("utf-8")
          ).digest()
          archive.with_suffix(archive.suffix + ".hmac").write_text(
              hmac.new(key, archive.read_bytes(), hashlib.sha256).hexdigest() + "\n",
              encoding="ascii",
          )
          PY

      - name: Preserve encrypted scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-security-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-security-results-${{ github.run_id }}.tar.gz.enc
            ${{ runner.temp }}/codex-security-results-${{ github.run_id }}.tar.gz.enc.hmac
          if-no-files-found: error
          retention-days: 7
