name: Codex Security remediation

on:
  workflow_call:
    inputs:
      target_ref:
        description: Trusted default branch to scan and remediate.
        required: false
        type: string
        default: main
    secrets:
      oauth_json:
        description: File-backed ChatGPT OAuth record for Codex Security.
        required: true

permissions: {}

concurrency:
  group: codex-security-remediation-${{ github.repository }}
  cancel-in-progress: false

env:
  TARGET_DIR: ${{ github.workspace }}/odinn-forge

jobs:
  prepare:
    name: Generate bounded candidate
    if: github.repository == 'BlueDot-IT/Odinn-Forge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.scan.outputs.base-sha }}
      finding-count: ${{ steps.scan.outputs.finding-count }}
    steps:
      - name: Validate trusted target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REF" = "main"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check out scanner dependency lock
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: BlueDot-IT/odinn-maintainer
          ref: main
          path: codex-security-control-plane
          persist-credentials: false
          sparse-checkout: .github/codex-security

      - name: Install Codex Security
        env:
          INSTALL_DIR: ${{ runner.temp }}/codex-security
          LOCK_DIR: ${{ github.workspace }}/codex-security-control-plane/.github/codex-security
          EXPECTED_LOCK_SHA256: c036a0a182450fe0e908a8eea82143fe55e7603e58b691d69c020785acb1cbc7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          cp "$LOCK_DIR/package.json" "$LOCK_DIR/package-lock.json" "$INSTALL_DIR/"
          printf '%s  %s\n' "$EXPECTED_LOCK_SHA256" "$INSTALL_DIR/package-lock.json" |
            sha256sum --check --strict
          npm ci \
            --prefix "$INSTALL_DIR" \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify Codex Security and Linux sandbox
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          CODEX_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CODEX_SECURITY_BIN"
          test -x "$CODEX_BIN"
          test "$("$CODEX_SECURITY_BIN" --version)" = "0.1.4"

          if test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          "$CODEX_BIN" sandbox true

      - name: Check out trusted Forge branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: BlueDot-IT/Odinn-Forge
          ref: main
          path: odinn-forge
          fetch-depth: 0
          persist-credentials: false

      - name: Bind scan to an immutable worktree snapshot
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Codex Security CI snapshot marker; intentionally untracked.' \
            > "$TARGET_DIR/.codex-security-ci-snapshot"

      - name: Restore ChatGPT OAuth sign-in
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          OAUTH_JSON: ${{ secrets.oauth_json }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OAUTH_JSON"
          install -d -m 700 "$CODEX_HOME"
          printf '%s' "$OAUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          "$CODEX_SECURITY_BIN" login status

      - name: Scan current Forge main
        id: scan
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
        shell: bash
        run: |
          set -euo pipefail
          if ! "$CODEX_SECURITY_BIN" scan "$TARGET_DIR" \
            --mode standard \
            --model gpt-5.6-terra \
            --output-dir "$SCAN_DIR" \
            --json > "$RUNNER_TEMP/codex-security.json" \
            2> "$RUNNER_TEMP/codex-security-scan.log"; then
            echo "Codex Security did not produce a complete scan." >&2
            exit 1
          fi

          test -s "$SCAN_DIR/scan-manifest.json"
          test -s "$SCAN_DIR/findings.json"
          test "$(jq -r '.scan.status' "$SCAN_DIR/scan-manifest.json")" = "completed"
          test "$(jq -r '.completeness' "$SCAN_DIR/coverage.json")" = "complete"

          base_sha=$(git -C "$TARGET_DIR" rev-parse HEAD)
          scan_sha=$(jq -r '.scan.target.revision' "$SCAN_DIR/scan-manifest.json")
          test "$base_sha" = "$scan_sha"

          finding_count=$(jq '.findings | length' "$SCAN_DIR/findings.json")
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "finding-count=$finding_count" >> "$GITHUB_OUTPUT"

      - name: Generate candidate remediation
        if: steps.scan.outputs.finding-count != '0'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          FINDINGS_FILE: ${{ runner.temp }}/codex-security-results/findings.json
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if ! "$CODEX_SECURITY_BIN" patch "$FINDINGS_FILE" \
            > "$RUNNER_TEMP/codex-security-patch.log" 2>&1; then
            echo "Codex Security could not generate a complete remediation." >&2
            exit 1
          fi

      - name: Remove model credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/codex-home"
          rm -f -- "$TARGET_DIR/.codex-security-ci-snapshot"
          test ! -e "$RUNNER_TEMP/codex-home"
          test ! -e "$TARGET_DIR/.codex-security-ci-snapshot"

      - name: Package bounded candidate
        id: candidate
        if: steps.scan.outputs.finding-count != '0'
        env:
          FINDINGS_FILE: ${{ runner.temp }}/codex-security-results/findings.json
          BASE_SHA: ${{ steps.scan.outputs.base-sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/codex-security-candidate
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git diff --cached --name-only)"

          git add -N -- .
          mapfile -d '' changed < <(git diff --name-only --diff-filter=ACMRTUXB -z)
          test "${#changed[@]}" -gt 0
          test "${#changed[@]}" -le 20
          test -z "$(git diff --name-only --diff-filter=D)"
          git diff --check

          if git diff --summary | grep -Eq 'mode change|create mode 120000|create mode 160000'; then
            echo "Candidate changes file modes, symlinks, or submodules." >&2
            exit 1
          fi

          if git diff --numstat | awk '$1 == "-" || $2 == "-" { found=1 } END { exit !found }'; then
            echo "Candidate contains a binary change." >&2
            exit 1
          fi

          diff_bytes=$(git diff --binary | wc -c)
          test "$diff_bytes" -le 300000

          jq -r '.findings[].locations[].path' "$FINDINGS_FILE" |
            sort -u > "$RUNNER_TEMP/codex-security-affected-paths.txt"

          for path in "${changed[@]}"; do
            case "$path" in
              .github/*|.git/*|scripts/*|package.json|pnpm-lock.yaml|\
              *credentials*|*secrets*|*.env|*.pem|*.key)
                echo "Candidate touches a denied path." >&2
                exit 1
                ;;
              test/*|tests/*|docs/*)
                ;;
              *)
                if ! grep -Fqx -- "$path" "$RUNNER_TEMP/codex-security-affected-paths.txt"; then
                  echo "Candidate expands beyond affected files and bounded proof paths." >&2
                  exit 1
                fi
                ;;
            esac
          done

          fingerprint=$(
            jq -r '.findings[].fingerprints.primary' "$FINDINGS_FILE" |
              sort |
              sha256sum |
              cut -d' ' -f1
          )
          branch="odinn-maintainer/security-${BASE_SHA:0:12}-${fingerprint:0:12}"

          install -d -m 700 "$CANDIDATE_DIR"
          printf '%s\n' "$BASE_SHA" > "$CANDIDATE_DIR/base-sha"
          printf '%s\n' "$branch" > "$CANDIDATE_DIR/branch"
          git diff --binary > "$CANDIDATE_DIR/candidate.patch"
          sha256sum "$CANDIDATE_DIR/candidate.patch" > "$CANDIDATE_DIR/candidate.patch.sha256"

      - name: Upload bounded candidate
        if: steps.scan.outputs.finding-count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-security-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-security-candidate
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate candidate without credentials
    needs: prepare
    if: needs.prepare.outputs.finding-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Check out exact scanned revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: BlueDot-IT/Odinn-Forge
          ref: ${{ needs.prepare.outputs.base-sha }}
          path: odinn-forge
          fetch-depth: 0
          persist-credentials: false

      - name: Download bounded candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codex-security-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-security-candidate

      - name: Apply and verify candidate
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/codex-security-candidate
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$CANDIDATE_DIR/base-sha")" = "$BASE_SHA"
          grep -Eq '^odinn-maintainer/security-[0-9a-f]{12}-[0-9a-f]{12}$' "$CANDIDATE_DIR/branch"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check candidate.patch.sha256
          )
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check "$CANDIDATE_DIR/candidate.patch"
          git apply "$CANDIDATE_DIR/candidate.patch"
          git diff --check

      - name: Verify candidate against Forge checks
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check

  publish:
    name: Publish validated draft pull request
    needs: [prepare, validate]
    if: needs.prepare.outputs.finding-count != '0' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out exact scanned revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: BlueDot-IT/Odinn-Forge
          ref: ${{ needs.prepare.outputs.base-sha }}
          path: odinn-forge
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codex-security-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-security-candidate

      - name: Reconstruct candidate commit
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/codex-security-candidate
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$CANDIDATE_DIR/base-sha")" = "$BASE_SHA"
          grep -Eq '^odinn-maintainer/security-[0-9a-f]{12}-[0-9a-f]{12}$' "$CANDIDATE_DIR/branch"
          (
            cd "$CANDIDATE_DIR"
            sha256sum --check candidate.patch.sha256
          )
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check "$CANDIDATE_DIR/candidate.patch"
          git apply "$CANDIDATE_DIR/candidate.patch"
          git diff --check
          test -z "$(git diff --name-only --diff-filter=D)"

          branch=$(cat "$CANDIDATE_DIR/branch")
          git switch -c "$branch"
          git add --all
          git config user.name "odinn-maintainer[bot]"
          git config user.email "odinn-maintainer[bot]@users.noreply.github.com"
          git commit -m "security: apply automated Codex remediation"

      - name: Push branch and open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/codex-security-candidate
        working-directory: ${{ env.TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(cat "$CANDIDATE_DIR/branch")
          gh auth setup-git
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

          existing=$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$branch" \
              --json url \
              --jq '.[0].url // ""'
          )
          if test -n "$existing"; then
            echo "Reusing existing bounded remediation pull request."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "A same-name branch exists without an open pull request." >&2
            exit 1
          fi

          git push --set-upstream origin "$branch"

          body_file=$(mktemp)
          printf '%s\n' \
            'Automated bounded remediation for the latest complete Codex Security scan.' \
            '' \
            '- Generated from the current protected default-branch revision.' \
            '- Candidate paths and diff size passed deterministic limits.' \
            '- Validation ran in a separate credential-free job.' \
            '- No automatic merge is authorized; maintainer review is required.' \
            > "$body_file"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --draft \
            --title "security: apply automated hardening" \
            --body-file "$body_file"

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$branch"
