name: Test maintainer

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test_matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm run check
      - name: Measure imported-module coverage
        if: runner.os == 'Linux'
        run: node --experimental-test-coverage --test tests/*.test.ts

  test:
    name: test
    if: ${{ always() }}
    needs: test_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Enforce complete platform matrix
        env:
          MATRIX_RESULT: ${{ needs.test_matrix.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_RESULT" = "success"
